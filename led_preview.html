<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED Strip Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 16px;
      color: #7ec8e3;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls input {
      background: #16213e;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 180px;
    }

    .controls button {
      background: #0f3460;
      border: 1px solid #533483;
      color: #e0e0e0;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .controls button:hover {
      background: #533483;
    }

    .status {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .status.connected {
      background: #1b4332;
      color: #95d5b2;
    }

    .status.disconnected {
      background: #3d0814;
      color: #ff6b6b;
    }

    .led-strip-container {
      width: 100%;
      max-width: 900px;
      margin-bottom: 20px;
    }

    .led-label {
      font-size: 0.7rem;
      color: #888;
      margin-bottom: 4px;
      text-align: center;
    }

    .led-strip {
      display: flex;
      gap: 2px;
      justify-content: center;
      padding: 12px 8px;
      background: #0d1117;
      border-radius: 10px;
      border: 1px solid #21262d;
      flex-wrap: wrap;
    }

    .led {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid #333;
      transition: background-color 0.05s;
      position: relative;
    }

    .led:hover {
      border-color: #fff;
      z-index: 1;
      transform: scale(1.3);
    }

    .led .tooltip {
      display: none;
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: #161b22;
      color: #e0e0e0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.65rem;
      white-space: nowrap;
      border: 1px solid #333;
      z-index: 10;
      pointer-events: none;
    }

    .led:hover .tooltip {
      display: block;
    }

    .section-markers {
      display: flex;
      gap: 2px;
      justify-content: center;
      margin-bottom: 6px;
    }

    .section-marker {
      font-size: 0.6rem;
      color: #555;
      text-align: center;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 16px;
    }

    .info-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .info-card .label {
      font-size: 0.65rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-card .value {
      font-size: 1rem;
      font-weight: bold;
      margin-top: 2px;
    }

    .layout {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 10px;
    }

    .layout .section {
      flex: 1;
      text-align: center;
      font-size: 0.6rem;
      color: #555;
      padding: 2px 0;
    }

    .demo-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .demo-btn {
      background: #16213e;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .demo-btn:hover,
    .demo-btn.active {
      background: #533483;
      border-color: #7b2ff7;
    }
  </style>
</head>

<body>

  <h1>LED Strip Preview</h1>

  <div class="controls">
    <input type="text" id="robotIp" placeholder="Robot IP (e.g. 10.24.71.2)" value="127.0.0.1">
    <button id="connectBtn" onclick="toggleConnection()">Connect</button>
    <span id="statusText" class="status disconnected">Disconnected</span>
  </div>

  <div class="demo-controls">
    <span style="font-size:0.75rem; color:#888; align-self:center;">Demo:</span>
    <button class="demo-btn" onclick="demoDisabled()">Disabled (Breathe)</button>
    <button class="demo-btn" onclick="demoNormal()">Normal</button>
    <button class="demo-btn" onclick="demoShooting()">Shooting</button>
    <button class="demo-btn" onclick="demoAttack()">Attack Mode</button>
  </div>

  <div class="info">
    <div class="info-card">
      <div class="label">ChassisMode</div>
      <div class="value" id="infoChassisMode">-</div>
    </div>
    <div class="info-card">
      <div class="label">ShootPhase</div>
      <div class="value" id="infoShootPhase">-</div>
    </div>
    <div class="info-card">
      <div class="label">AttackTimer</div>
      <div class="value" id="infoAttackTimer">-</div>
    </div>
    <div class="info-card">
      <div class="label">LEDs Active</div>
      <div class="value" id="infoLedsActive">0 / 30</div>
    </div>
  </div>

  <div class="layout">
    <!-- <div class="section">GYRO (0-1)</div> -->
    <div class="section">CHASSIS L (2-5)</div>
    <div class="section">SHOOTER MID (6-27)</div>
    <div class="section">CHASSIS R (28-31)</div>
  </div>

  <div class="led-strip-container">
    <div class="led-strip" id="ledStrip"></div>
  </div>

  <script>
    const LED_COUNT = 32;
    const HIDDEN_LEDS = new Set([0, 1]); // Gyro pins, not real LEDs
    const DISPLAY_COUNT = LED_COUNT - HIDDEN_LEDS.size;
    const SECTIONS = {
      chassisL: { start: 2, end: 5, label: 'CHASSIS LEFT' },
      shooterMid: { start: 6, end: 27, label: 'SHOOTER MID' },
      chassisR: { start: 28, end: 31, label: 'CHASSIS RIGHT' },
    };

    // Build LED elements (skip hidden gyro pins)
    const strip = document.getElementById('ledStrip');
    const leds = [];
    for (let i = 0; i < LED_COUNT; i++) {
      if (HIDDEN_LEDS.has(i)) {
        leds.push(null);
        continue;
      }
      const el = document.createElement('div');
      el.className = 'led';
      el.style.backgroundColor = '#000';
      const tip = document.createElement('span');
      tip.className = 'tooltip';
      tip.textContent = `#${i}`;
      el.appendChild(tip);
      strip.appendChild(el);
      leds.push(el);
    }

    function setLed(index, r, g, b) {
      if (index < 0 || index >= LED_COUNT || HIDDEN_LEDS.has(index)) return;
      r = Math.round(Math.max(0, Math.min(255, r)));
      g = Math.round(Math.max(0, Math.min(255, g)));
      b = Math.round(Math.max(0, Math.min(255, b)));
      leds[index].style.backgroundColor = `rgb(${r},${g},${b})`;
      leds[index].querySelector('.tooltip').textContent = `#${index}  rgb(${r},${g},${b})`;
    }

    function applyBuffer(rgb) {
      let active = 0;
      for (let i = 0; i < LED_COUNT; i++) {
        if (HIDDEN_LEDS.has(i)) continue;
        const r = Math.round(rgb[i * 3] * 255);
        const g = Math.round(rgb[i * 3 + 1] * 255);
        const b = Math.round(rgb[i * 3 + 2] * 255);
        setLed(i, r, g, b);
        if (r > 0 || g > 0 || b > 0) active++;
      }
      document.getElementById('infoLedsActive').textContent = `${active} / ${DISPLAY_COUNT}`;
    }

    function clearAll() {
      for (let i = 0; i < LED_COUNT; i++) {
        if (!HIDDEN_LEDS.has(i)) setLed(i, 0, 0, 0);
      }
    }

    // --- NT4 Connection (protocol per WPILib NT4 spec + elastic_dashboard nt4_client.dart) ---
    const AK_PREFIXES = ['/AdvantageKit/RealOutputs', '/AdvantageKit/SimOutputs'];
    const AK_FIELDS = [
      { path: '/LED/Buffer', periodic: 0.05 },
      { path: '/LED/ChassisMode', periodic: 0.5 },
      { path: '/LED/ShootPhase', periodic: 0.5 },
      { path: '/SuperStructure/AttackModeTimerSec', periodic: 0.5 },
      { path: '/SuperStructure/ChassisMode', periodic: 0.5 },
    ];
    const NT4_TOPICS = AK_PREFIXES.flatMap((prefix) =>
      AK_FIELDS.map((field) => ({ name: prefix + field.path, periodic: field.periodic }))
    );

    let ws = null;
    let connected = false;
    let subUidCounter = 0;
    const subscriptions = new Map();
    const announcedTopics = {};
    const topicValues = {};

    function toggleConnection() {
      if (connected) disconnect();
      else connect();
    }

    function connect() {
      const ip = document.getElementById('robotIp').value.trim();
      if (!ip) return;
      stopDemo();

      const url = `ws://${ip}:5810/nt/LED-Preview`;
      ws = new WebSocket(url, [
        'networktables.first.wpi.edu',
        'v4.1.networktables.first.wpi.edu',
      ]);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        connected = true;
        updateStatus(true);
        for (const topic of NT4_TOPICS) subscribeTopic(topic.name, topic.periodic);
      };

      ws.onmessage = (evt) => {
        if (typeof evt.data === 'string') handleTextFrame(evt.data);
        else handleBinaryFrame(evt.data);
      };

      ws.onclose = () => {
        connected = false;
        updateStatus(false);
        subscriptions.clear();
        Object.keys(announcedTopics).forEach((k) => delete announcedTopics[k]);
      };
      ws.onerror = () => {
        connected = false;
        updateStatus(false);
      };
    }

    function disconnect() {
      if (ws) {
        for (const sub of subscriptions.values()) wsSend('unsubscribe', { subuid: sub.uid });
        ws.close();
        ws = null;
      }
      connected = false;
      updateStatus(false);
      subscriptions.clear();
      Object.keys(announcedTopics).forEach((k) => delete announcedTopics[k]);
    }

    function updateStatus(ok) {
      const el = document.getElementById('statusText');
      const btn = document.getElementById('connectBtn');
      el.className = 'status ' + (ok ? 'connected' : 'disconnected');
      el.textContent = ok ? 'Connected' : 'Disconnected';
      btn.textContent = ok ? 'Disconnect' : 'Connect';
    }

    function wsSend(method, params) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify([{ method, params }]));
    }

    function subscribeTopic(topic, periodic) {
      const uid = ++subUidCounter;
      subscriptions.set(topic, { uid, topic });
      wsSend('subscribe', {
        topics: [topic],
        subuid: uid,
        options: { periodic, prefix: false },
      });
    }

    function handleTextFrame(text) {
      let messages;
      try {
        messages = JSON.parse(text);
      } catch {
        return;
      }
      if (!Array.isArray(messages)) return;

      for (const msg of messages) {
        if (!msg || typeof msg.method !== 'string' || !msg.params) continue;
        if (msg.method === 'announce') {
          const { id, name, type } = msg.params;
          announcedTopics[id] = { name, type };
        } else if (msg.method === 'unannounce') {
          delete announcedTopics[msg.params.id];
        }
      }
    }

    // Minimal MessagePack decoder for NT4 binary value updates
    class MsgPackReader {
      constructor(buffer) {
        this.buf = new Uint8Array(buffer);
        this.pos = 0;
      }

      get done() {
        return this.pos >= this.buf.length;
      }

      readU8() {
        return this.buf[this.pos++];
      }

      readU16() {
        const v = (this.buf[this.pos] << 8) | this.buf[this.pos + 1];
        this.pos += 2;
        return v;
      }

      readU32() {
        const v =
          (this.buf[this.pos] << 24) |
          (this.buf[this.pos + 1] << 16) |
          (this.buf[this.pos + 2] << 8) |
          this.buf[this.pos + 3];
        this.pos += 4;
        return v >>> 0;
      }

      readI8() {
        const v = this.readU8();
        return v > 127 ? v - 256 : v;
      }

      readI16() {
        const v = this.readU16();
        return v > 32767 ? v - 65536 : v;
      }

      readI32() {
        return this.readU32() | 0;
      }

      readI64() {
        const hi = this.readI32();
        const lo = this.readU32();
        return hi * 0x100000000 + lo;
      }

      readF32() {
        const view = new DataView(this.buf.buffer, this.buf.byteOffset + this.pos, 4);
        const v = view.getFloat32(0, false);
        this.pos += 4;
        return v;
      }

      readF64() {
        const view = new DataView(this.buf.buffer, this.buf.byteOffset + this.pos, 8);
        const v = view.getFloat64(0, false);
        this.pos += 8;
        return v;
      }

      readBytes(len) {
        const slice = this.buf.subarray(this.pos, this.pos + len);
        this.pos += len;
        return slice;
      }

      read() {
        const tag = this.readU8();

        if (tag <= 0x7f) return tag;
        if (tag >= 0xe0) return tag - 256;
        if ((tag & 0xf0) === 0x90) return this.readArray(tag & 0x0f);
        if (tag === 0xdc) return this.readArray(this.readU16());
        if (tag === 0xdd) return this.readArray(this.readU32());
        if ((tag & 0xe0) === 0xa0) return this.readStr(tag & 0x1f);
        if (tag === 0xd9) return this.readStr(this.readU8());
        if (tag === 0xda) return this.readStr(this.readU16());
        if (tag === 0xdb) return this.readStr(this.readU32());
        if (tag === 0xc0) return null;
        if (tag === 0xc2) return false;
        if (tag === 0xc3) return true;
        if (tag === 0xcc) return this.readU8();
        if (tag === 0xcd) return this.readU16();
        if (tag === 0xce) return this.readU32();
        if (tag === 0xcf) return this.readI64();
        if (tag === 0xd0) return this.readI8();
        if (tag === 0xd1) return this.readI16();
        if (tag === 0xd2) return this.readI32();
        if (tag === 0xd3) return this.readI64();
        if (tag === 0xca) return this.readF32();
        if (tag === 0xcb) return this.readF64();

        throw new Error('Unsupported MessagePack tag: 0x' + tag.toString(16));
      }

      readArray(len) {
        const arr = new Array(len);
        for (let i = 0; i < len; i++) arr[i] = this.read();
        return arr;
      }

      readStr(len) {
        const bytes = this.readBytes(len);
        return new TextDecoder().decode(bytes);
      }
    }

    function handleBinaryFrame(data) {
      const reader = new MsgPackReader(data);
      let changed = false;

      while (!reader.done) {
        try {
          const msg = reader.read();
          if (!Array.isArray(msg) || msg.length < 4) continue;

          const topicId = msg[0];
          if (topicId < 0) continue;

          const topic = announcedTopics[topicId];
          if (!topic) continue;

          topicValues[topic.name] = msg[3];
          changed = true;
        } catch {
          break;
        }
      }

      if (changed) processUpdates();
    }

    function getAkValue(suffix) {
      for (const prefix of AK_PREFIXES) {
        const v = topicValues[prefix + suffix];
        if (v !== undefined) return v;
      }
      return undefined;
    }

    function processUpdates() {
      const buf = getAkValue('/LED/Buffer');
      if (buf && Array.isArray(buf)) applyBuffer(buf);

      const cm = getAkValue('/LED/ChassisMode') || getAkValue('/SuperStructure/ChassisMode');
      if (cm !== undefined) document.getElementById('infoChassisMode').textContent = cm;

      const sp = getAkValue('/LED/ShootPhase');
      if (sp !== undefined) document.getElementById('infoShootPhase').textContent = sp;

      const at = getAkValue('/SuperStructure/AttackModeTimerSec');
      if (at !== undefined) {
        document.getElementById('infoAttackTimer').textContent =
          typeof at === 'number' ? at.toFixed(1) + 's' : at;
      }
    }

    // --- Demo modes (offline preview) ---
    let demoAnim = null;

    function stopDemo() {
      if (demoAnim) { cancelAnimationFrame(demoAnim); demoAnim = null; }
      document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
    }

    function demoDisabled() {
      stopDemo();
      document.querySelectorAll('.demo-btn')[0].classList.add('active');
      document.getElementById('infoChassisMode').textContent = 'NORMAL';
      document.getElementById('infoShootPhase').textContent = 'DISABLED';
      let t = 0;
      function frame() {
        t += 0.03;
        const brightness = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 2));
        const r = Math.round(128 * brightness);
        const g = Math.round(0 * brightness);
        const b = Math.round(255 * brightness);
        for (let i = 0; i < LED_COUNT; i++) setLed(i, r, g, b);
        document.getElementById('infoLedsActive').textContent = `${DISPLAY_COUNT} / ${DISPLAY_COUNT}`;
        demoAnim = requestAnimationFrame(frame);
      }
      frame();
    }

    function demoNormal() {
      stopDemo();
      document.querySelectorAll('.demo-btn')[1].classList.add('active');
      document.getElementById('infoChassisMode').textContent = 'NORMAL';
      document.getElementById('infoShootPhase').textContent = 'OFF';
      clearAll();
      // Chassis sides: white
      for (let i = 2; i <= 5; i++) setLed(i, 255, 255, 255);
      for (let i = 28; i <= 31; i++) setLed(i, 255, 255, 255);
      // Shooter mid: dim
      for (let i = 6; i <= 27; i++) setLed(i, 30, 30, 30);
      document.getElementById('infoLedsActive').textContent = `${DISPLAY_COUNT} / ${DISPLAY_COUNT}`;
    }

    function demoShooting() {
      stopDemo();
      document.querySelectorAll('.demo-btn')[2].classList.add('active');
      document.getElementById('infoChassisMode').textContent = 'SHOOTING';
      document.getElementById('infoShootPhase').textContent = 'AIM';
      clearAll();
      // All: yellow (AIM)
      for (let i = 0; i < LED_COUNT; i++) setLed(i, 255, 255, 0);
      document.getElementById('infoLedsActive').textContent = `${DISPLAY_COUNT} / ${DISPLAY_COUNT}`;
    }

    function demoAttack() {
      stopDemo();
      document.querySelectorAll('.demo-btn')[3].classList.add('active');
      document.getElementById('infoChassisMode').textContent = 'ATTACK';
      document.getElementById('infoShootPhase').textContent = 'OFF';
      document.getElementById('infoAttackTimer').textContent = '0.0s';
      const attackColor = [36, 124, 228];
      const midStart = 6, midEnd = 27;
      const halfLen = Math.floor((midEnd - midStart + 1) / 2);
      const center = midStart + halfLen;
      let offset = 0;
      let elapsed = 0;
      const lastTime = performance.now();

      function frame() {
        const now = performance.now();
        elapsed += (now - (frame.last || now)) / 1000;
        frame.last = now;
        document.getElementById('infoAttackTimer').textContent = elapsed.toFixed(1) + 's';

        clearAll();
        // Chassis sides: attack blue
        for (let i = 2; i <= 5; i++) setLed(i, ...attackColor);
        for (let i = 28; i <= 31; i++) setLed(i, ...attackColor);
        // Shooter mid: dim base
        for (let i = midStart; i <= midEnd; i++) setLed(i, 15, 15, 30);

        // Rolling band
        const off = Math.floor(offset);
        // Left band
        for (let w = 0; w < 2; w++) {
          const idx = center - off - w;
          if (idx >= midStart && idx <= midEnd) setLed(idx, ...attackColor);
        }
        // Right band
        for (let w = 0; w < 2; w++) {
          const idx = center + off + w;
          if (idx >= midStart && idx <= midEnd) setLed(idx, ...attackColor);
        }

        offset += 0.15;
        if (offset > halfLen) { offset = 0; elapsed = 0; }
        document.getElementById('infoLedsActive').textContent = `${DISPLAY_COUNT} / ${DISPLAY_COUNT}`;
        demoAnim = requestAnimationFrame(frame);
      }
      frame.last = performance.now();
      frame();
    }

    // Init
    clearAll();
  </script>
</body>

</html>
